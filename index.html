<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="./src/styles/globals.css" />
    <link rel="stylesheet" href="./src/styles/fonts/fonts.css" />
    <link rel="stylesheet" href="./src/styles/variables.css" />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <script src="./src/app.js" defer></script>
  </head>
  <body class="page">
    <div class="container">
      <main>
        <h1 class="visually-hidden">Прогноз погоды</h1>
        <header class="header">
          <img
            src="./src/assets/logo/weather-logo.svg"
            alt="Логотип сервиса погоды"
          />
          <form class="form-search" id="form-search">
            <label class="visually-hidden" for="search-city"
              >Поиск по городу</label
            >
            <input
              class="form-search__input"
              id="search-city"
              name="search-city"
              type="search"
              placeholder="Поиск по городу"
            />
            <button
              class="form-search__button-search"
              type="submit"
              aria-label="Найти город"
            >
              <img src="./src/assets/icons/search.svg" alt="" />
            </button>
            <button
              class="form-search__button-clear disable"
              type="button"
              aria-label="Очистить содержимое"
            >
              <img src="./src/assets/icons/clear.svg" alt="" />
            </button>
          </form>
        </header>
        <div class="content">
          <section class="current-weather">
            <h2 class="visually-hidden">Прогноз погоды выбранного города</h2>
            <div class="current-weather__info">
              <p class="current-weather__title">Москва</p>
              <p>Суббота, 06 января</p>
              <p>11:29</p>
            </div>
            <div class="current-weather__info">
              <p class="current-weather__temp">-7°</p>
            </div>
            <div class="current-weather__info">
              <div class="current-weather__info-group">
                <img src="./src/assets/icons/weather-icon.svg" alt="" />
                <p>Облачно</p>
              </div>
              <p>Ощущается как -11°</p>
            </div>
          </section>
          <h2 class="visually-hidden">Прогноз погоды других городов</h2>
          <ul class="weather-details">
            <li class="weather-details__card"></li>
            <li class="weather-details__card"></li>
            <li class="weather-details__card"></li>
            <li class="weather-details__card"></li>
            <li class="weather-details__card"></li>
            <li class="weather-details__card"></li>
          </ul>
        </div>
      </main>
    </div>
  </body>
</html>
