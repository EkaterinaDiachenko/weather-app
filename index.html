<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="./src/styles/globals.css" />
    <link rel="stylesheet" href="./src/styles/fonts/fonts.css" />
    <link rel="stylesheet" href="./src/styles/variables.css" />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <link rel="icon" href="./public/favicon.ico" type="image/x-icon" />
    <script src="./src/mock-datas/weather-datas.js"></script>
    <script src="./src/app.js" defer></script>
  </head>
  <body class="page">
    <div class="container">
      <h1 class="visually-hidden">Прогноз погоды</h1>
      <header class="header">
        <img
          href="#"
          src="./src/assets/logo/weather-logo.svg"
          width="192"
          height="31"
          alt="Логотип сервиса погоды"
        />
        <form class="form-search" id="form-search">
          <label class="visually-hidden" for="search-city"
            >Поиск по городу</label
          >
          <input
            class="form-search__input"
            id="search-city"
            name="search-city"
            type="search"
            placeholder="Поиск по городу"
          />
          <button
            class="form-search__button-search"
            type="submit"
            aria-label="Найти город"
          >
            <img
              src="./src/assets/icons/search.svg"
              alt=""
              width="24"
              height="24"
            />
          </button>
          <button
            class="form-search__button-clear is-hidden"
            type="button"
            aria-label="Очистить содержимое"
          >
            <img
              class="form-search__clear-icon"
              src="./src/assets/icons/clear.svg"
              width="24"
              height="24"
              alt=""
            />
          </button>
        </form>
      </header>
      <main>
        <div class="content">
          <section class="current-weather">
            <h2 class="visually-hidden">Прогноз погоды выбранного города</h2>
            <div class="current-weather__location">
              <p class="current-weather__title">Москва</p>
              <time class="current-weather__date" datetime="2024-01-06">
                Суббота, 06 января
              </time>
              <time class="current-weather__time" datetime="11:29">
                11:29
              </time>
            </div>
            <div class="current-weather__temp-block">
              <p class="current-weather__temp">-7°</p>
            </div>
            <div class="current-weather__condition">
              <div class="current-weather__info-group">
                <img
                  class="current-weather__icon"
                  src="./src/assets/icons/weather-icon.svg"
                  width="24"
                  height="24"
                  alt=""
                />
                <p class="current-weather__description">Облачно</p>
              </div>
              <p class="current-weather__feels-like">Ощущается как -11°</p>
            </div>
          </section>
          <section>
            <h2 class="visually-hidden">Показатели выбранного города</h2>
            <ul class="weather-details"></ul>
          </section>
        </div>
      </main>
    </div>
  </body>

  <template id="weather-card-template">
    <li class="weather-details__card">
      <div class="weather-details__main">
        <p class="weather-details__title"></p>
        <img
          class="weather-details__image"
          width="32"
          height="32"
          src=""
          alt=""
        />
        <p class="weather-details__value"></p>
      </div>

      <div class="weather-details__footer">
        <img
          class="weather-details__image-bar"
          width="126"
          height="8"
          src=""
          alt=""
        />
        <div class="weather-details__description"></div>
      </div>
    </li>
  </template>
</html>
